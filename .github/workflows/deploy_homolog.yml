name: Deploy Vue App

on:
  push:
    branches:
      - homolog

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🧱 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🛠️ Build project
        run: npm run build
        env:
          VITE_BASE_REQUEST_URL: ${{ secrets.VITE_BASE_REQUEST_URL }}
          BASE_URL: "http://dev.arquigrafia.org.br"
          VITE_TITLE: "ARQUIGRAFIA"
          VITE_GRANT_TYPE: "password"
          VITE_CLIENT_ID: "1"
          VITE_CLIENT_SECRET: ${{ secrets.VITE_CLIENT_SECRET}}
          VITE_SCOPE: "*"
      
      - name: 📂 Copy files via SSH
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: ${{ secrets.REMOTE_PATH }}/dist
          rm: true

